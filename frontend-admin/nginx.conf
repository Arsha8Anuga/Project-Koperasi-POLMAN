# ISI FILE INI IDENTIK di frontend-kasir & frontend-admin.
# Ini TEMPLATE: saat container start, image nginx resmi mengganti ${BACKEND_HOST} dan ${BACKEND_PORT}
# dengan environment variable (lihat Dockerfile & docker-compose.yml). Hanya variabel berawalan BACKEND_
# yang diganti (NGINX_ENVSUBST_FILTER), jadi variabel nginx seperti $host / $uri tidak tersentuh.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS internal Docker. Dengan variabel, nama "backend" di-resolve saat request (bukan saat start),
    # jadi nginx tetap jalan walau backend belum siap / di-restart dengan IP baru.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://${BACKEND_HOST}:${BACKEND_PORT};

    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API → backend (path /api/v1/... diteruskan apa adanya)
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Aset hasil build punya hash di nama file → aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # SPA: semua route Vue Router jatuh ke index.html; index.html jangan di-cache
    # supaya deploy baru langsung terpakai.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
