# Stack Portainer "koperasi" — dibuild langsung dari repo Git (Stacks → Add stack → Repository).
# Rahasia TIDAK ditulis di sini: isi di bagian "Environment variables" stack (lihat stack.env.example).
# MongoDB tidak ikut stack ini (pakai server Mongo yang sudah ada lewat MONGODB_URI).

services:
  backend:
    build:
      context: ./backend
    image: koperasi-backend:latest
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI wajib diisi}
      MONGODB_DB: ${MONGODB_DB:-koperasi_demo}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi (minimal 32 karakter)}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      # Frontend memanggil API lewat domain yang sama (/api), jadi CORS tidak dibutuhkan.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      APP_TZ: Asia/Jakarta
    volumes:
      # Foto produk yang diunggah. Named volume: tidak hilang saat redeploy / image dibangun ulang.
      # Di Portainer muncul sebagai volume "koperasi_media" (Volumes). Ikut di-backup bersama database.
      - media:/app/media
    # Tidak ada "ports": backend hanya bisa dijangkau container kasir/admin lewat jaringan internal stack
    # (nginx di kedua frontend memanggilnya dengan nama service "backend").

  # AI engine: worker tanpa port. Membaca transaksi & menulis collection insights (ai-engine/CONTRACT.md).
  # Boleh mati/restart kapan saja; kasir & admin tetap jalan dengan hasil terakhir.
  ai-engine:
    build:
      context: ./ai-engine
    image: koperasi-ai-engine:latest
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI wajib diisi}
      MONGODB_DB: ${MONGODB_DB:-koperasi_demo}
      AI_INTERVAL_MINUTES: ${AI_INTERVAL_MINUTES:-15}
      AI_LEAD_TIME_DAYS: ${AI_LEAD_TIME_DAYS:-3}
      AI_REVIEW_DAYS: ${AI_REVIEW_DAYS:-7}
      AI_SERVICE_LEVEL: ${AI_SERVICE_LEVEL:-0.95}
      TZ: Asia/Jakarta

  kasir:
    build:
      context: ./frontend-kasir
      args:
        VITE_API_URL: /api/v1
    image: koperasi-kasir:latest
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${KASIR_BIND:-0.0.0.0}:${KASIR_PORT:-8081}:80"

  admin:
    build:
      context: ./frontend-admin
      args:
        VITE_API_URL: /api/v1
    image: koperasi-admin:latest
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${ADMIN_BIND:-0.0.0.0}:${ADMIN_PORT:-8082}:80"

volumes:
  media:
